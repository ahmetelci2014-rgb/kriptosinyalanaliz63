name: New Listing Opportunity Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "1-56/5 * * * *"

permissions:
  contents: write

concurrency:
  group: new-listing-opportunity-radar
  cancel-in-progress: false

jobs:
  new-listing-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur ve pip önbelleğini hazırla
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Paketleri kur
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --prefer-binary -r requirements.txt

      - name: Yeni radar kodunu doğrula
        run: |
          python -m py_compile new_listing_radar.py
          python new_listing_radar.py --self-test

      - name: Yeni liste radarını hızlı takip modunda çalıştır
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        shell: bash
        run: |
          set -u

          # Manuel çalıştırmada tek kontrol yeterlidir.
          # Zamanlanmış çalışmada aynı runner içinde yaklaşık
          # 0, 60, 120 ve 180. saniyelerde dört kontrol yapılır.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            ROUNDS=1
          else
            ROUNDS=4
          fi

          START_TS=$(date +%s)
          FAILURES=0

          for ROUND in $(seq 1 "$ROUNDS")
          do
            echo "Yeni liste kontrol turu: ${ROUND}/${ROUNDS}"

            if ! python new_listing_radar.py
            then
              FAILURES=$((FAILURES + 1))
              echo "Kontrol turu hata verdi; kalan turlar devam edecek."
            fi

            if [ "$ROUND" -lt "$ROUNDS" ]
            then
              NEXT_TS=$((START_TS + ROUND * 60))
              NOW_TS=$(date +%s)
              SLEEP_SECONDS=$((NEXT_TS - NOW_TS))

              if [ "$SLEEP_SECONDS" -gt 0 ]
              then
                echo "Sonraki kontrol için ${SLEEP_SECONDS} saniye bekleniyor."
                sleep "$SLEEP_SECONDS"
              fi
            fi
          done

          if [ "$FAILURES" -gt 0 ]
          then
            echo "${FAILURES} kontrol turu hata verdi."
            exit 1
          fi

      - name: Radar state ve performansını kaydet
        if: always()
        shell: bash
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for file in \
            new_listing_radar_state.json \
            new_listing_performance_ledger.json
          do
            if [ -f "$file" ]; then
              git add "$file"
            else
              echo "$file henüz oluşmadı; atlandı."
            fi
          done

          if git diff --cached --quiet; then
            echo "Kaydedilecek yeni radar değişikliği yok."
            exit 0
          fi

          git commit -m "Update new listing radar state"

          for attempt in 1 2 3
          do
            echo "Push denemesi: $attempt"

            git pull --rebase --autostash origin main

            if git push origin HEAD:main; then
              echo "Yeni liste radar state dosyaları kaydedildi."
              exit 0
            fi

            sleep 10
          done

          echo "Yeni liste radar state dosyaları kaydedilemedi."
          exit 1
