name: Big Move Shadow Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write

concurrency:
  group: big-move-shadow-evidence
  cancel-in-progress: false

jobs:
  big-move-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Bagimliliklari kur
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --prefer-binary -r requirements.txt

      - name: Big Move shadow motorunu dogrula ve calistir
        run: |
          python -m py_compile \
            big_move_route.py \
            big_move_route_runner.py \
            big_move_shadow_runner.py \
            test_big_move_route.py
          python -m unittest -v test_big_move_route.py
          python big_move_route_runner.py --self-test
          python big_move_shadow_runner.py

      - name: Big Move sanal state ve ledger kaydet
        if: always()
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for file in big_move_route_state.json big_move_route_ledger.json
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "Kaydedilecek Big Move shadow degisikligi yok."
            exit 0
          fi

          git commit -m "Update Big Move shadow evidence"

          for attempt in 1 2 3
          do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done

          exit 1
