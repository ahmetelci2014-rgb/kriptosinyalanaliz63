name: Legacy Market Outlook - Manual Only

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-outlook-manual
  cancel-in-progress: false

jobs:
  outlook:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: En güncel main state ile eşitle
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Bağımlılıkları kur
        run: python -m pip install --prefer-binary -r requirements.txt

      - name: Genel piyasa yön motorunu çalıştır
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python market_outlook_runner.py

      - name: Market Outlook state kaydet
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull --rebase origin main || true
          git add market_outlook_state.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Market Outlook state değişmedi."
            exit 0
          fi

          git commit -m "Update Market Outlook state"

          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main || true
            sleep 2
          done

          exit 1