name: Pump Dump Shadow Data Mode

on:
  workflow_dispatch:
  schedule:
    - cron: "2,17,32,47 * * * *"

permissions:
  contents: write

concurrency:
  group: pump-shadow-data-mode
  cancel-in-progress: false

jobs:
  pump:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Paketleri kur
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --prefer-binary -r requirements.txt

      - name: Pump Dump shadow veri modunu calistir
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python pump_profit_runner.py

      - name: Pump Dump shadow durum ve performans kaydet
        if: always()
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for file in \
            pump_radar_state.json \
            pump_performance_ledger.json \
            market_impulse_state.json \
            portfolio_risk_shadow_pump_dump.json
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "Kaydedilecek Pump shadow degisikligi yok."
            exit 0
          fi

          git commit -m "Update Pump Dump shadow data state"

          for attempt in 1 2 3
          do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done

          exit 1