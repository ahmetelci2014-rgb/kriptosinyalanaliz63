name: Erken Pump/Dump Radarı

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: erken-pump-dump-radari
  cancel-in-progress: false

jobs:
  pump-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur ve pip önbelleğini hazırla
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Paketleri kur
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --prefer-binary -r requirements.txt

      - name: Erken pump/dump radar çalıştır
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python pump_radar.py

      - name: Pump/Dump durum, teşhis ve performans kayıtlarını güvenli kaydet
        if: always()
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for file in \
            pump_radar_state.json \
            pump_performance_ledger.json
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "Pump/Dump dosyalarında kaydedilecek değişiklik yok."
            exit 0
          fi

          git commit -m "Update pump dump state performance and diagnosis"

          for attempt in 1 2 3
          do
            echo "Push denemesi: $attempt"

            git pull --rebase --autostash origin main
            if git push origin HEAD:main
            then
              echo "Pump/Dump durum ve performans dosyaları kaydedildi."
              exit 0
            fi

            sleep 10
          done

          echo "Pump/Dump dosyaları üç denemede de kaydedilemedi."
          exit 1
