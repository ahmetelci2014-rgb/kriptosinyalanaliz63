name: Erken Pump/Dump Radarı

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: erken-pump-dump-radari
  cancel-in-progress: false

jobs:
  pump-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur ve pip önbelleğini hazırla
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Paketleri kur
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --prefer-binary -r requirements.txt

      - name: Erken pump/dump radar çalıştır
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          # Klasik Pump/Dump kalite şartları korunur.
          # Tüm aktif USDT perpetual evreninde canlı 5/15/30M impuls ölçülür.
          # Hızlanan coinler normal top-hacim listesinin önüne alınır; gerçek
          # giriş yine Pump/Trend-Continuation kalite + risk şartlarını geçmelidir.
          python -m py_compile \
            pump_radar.py \
            pump_live_runner.py \
            pump_impulse_live_runner.py \
            market_impulse_guard.py \
            test_pump_live_runner.py \
            test_market_impulse_guard.py \
            opportunity_capture.py \
            portfolio_risk.py \
            telegram_delivery.py
          python -m unittest -v test_pump_live_runner.py test_market_impulse_guard.py
          python pump_impulse_live_runner.py

      - name: Pump/Dump durum, impuls, teşhis ve performans kayıtlarını güvenli kaydet
        if: always()
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for file in \
            pump_radar_state.json \
            pump_performance_ledger.json \
            market_impulse_state.json \
            portfolio_risk_shadow_pump_dump.json
          do
            if [ -f "$file" ]; then
              git add "$file"
            else
              echo "$file henüz oluşmamış; atlandı."
            fi
          done

          if git diff --cached --quiet; then
            echo "Pump/Dump dosyalarında kaydedilecek değişiklik yok."
            exit 0
          fi

          git commit -m "Update pump dump state impulse performance and portfolio risk shadow"

          for attempt in 1 2 3
          do
            echo "Push denemesi: $attempt"

            git pull --rebase --autostash origin main
            if git push origin HEAD:main
            then
              echo "Pump/Dump durum, impuls ve performans dosyaları kaydedildi."
              exit 0
            fi

            sleep 10
          done

          echo "Pump/Dump dosyaları üç denemede de kaydedilemedi."
          exit 1
