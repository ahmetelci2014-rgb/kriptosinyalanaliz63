name: All Market Shadow Radar

on:
  workflow_dispatch:
  schedule:
    # Premium ana botla aynı dakikaya yığılmaması için 15 dakikada bir kaydırmalı çalışır.
    - cron: "3,18,33,48 * * * *"

permissions:
  contents: write

concurrency:
  group: all-market-shadow-radar
  cancel-in-progress: false

jobs:
  all-market-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Bağımlılıkları kur
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --prefer-binary -r requirements.txt

      - name: Tüm piyasa gölge motorunu doğrula
        run: |
          python -m py_compile all_market_shadow.py test_all_market_shadow.py
          python test_all_market_shadow.py -v

      - name: Tüm piyasa keşif ve sanal performans taramasını çalıştır
        run: |
          python all_market_shadow.py

      - name: Gölge state ve ledger kaydet
        if: always()
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for file in \
            all_market_shadow_state.json \
            all_market_shadow_ledger.json
          do
            if [ -f "$file" ]; then
              git add "$file"
            else
              echo "$file oluşmadı; atlandı."
            fi
          done

          if git diff --cached --quiet; then
            echo "Yeni gölge veri değişikliği yok."
            exit 0
          fi

          git commit -m "Update all market shadow performance"

          for attempt in 1 2 3
          do
            echo "Push denemesi: $attempt"
            git pull --rebase --autostash origin main

            if git push origin HEAD:main; then
              echo "Tüm piyasa gölge verileri kaydedildi."
              exit 0
            fi

            sleep 10
          done

          echo "Gölge veriler üç denemede de kaydedilemedi."
          exit 1
