name: Market Structure AI Shadow

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: market-structure-ai-shadow
  cancel-in-progress: false

jobs:
  market-structure-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: En guncel main state ile esitle
        if: ${{ github.ref_name == 'main' }}
        run: |
          set -e
          git fetch origin main
          git reset --hard origin/main

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Paketleri kur
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --prefer-binary -r requirements.txt

      - name: Market Structure AI shadow tara
        env:
          MARKET_STRUCTURE_MAX_COINS: "300"
          MARKET_STRUCTURE_MIN_QUOTE_VOLUME: "100000"
          MARKET_STRUCTURE_FETCH_LIMIT: "90"
        run: python market_structure_shadow_runner.py

      - name: Shadow state kaydet
        if: ${{ always() && github.ref_name == 'main' }}
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if [ -f market_structure_ai_shadow.json ]; then
            git add market_structure_ai_shadow.json
          fi
          if git diff --cached --quiet; then
            echo "Kaydedilecek market structure state yok."
            exit 0
          fi
          git commit -m "Update Market Structure AI shadow state"
          for attempt in 1 2 3
          do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 8
          done
          exit 1
