name: Premium Profit Mode V4 All Coins

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: premium-profit-mode-v4-all-coins
  cancel-in-progress: false

jobs:
  premium:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: En guncel main state ile esitle
        if: ${{ github.ref_name == 'main' }}
        run: |
          set -e
          git fetch origin main
          git reset --hard origin/main
          echo "Premium run SHA: $(git rev-parse HEAD)"

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Paketleri kur
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --prefer-binary -r requirements.txt

      - name: Kullanici arayuzunde acilamayan futures sinyallerini temizle
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        run: python untradable_futures_cleanup.py

      - name: Acik islemleri sonuc kontrolunden once devam gucu shadow
        run: python position_continuation_shadow.py

      - name: Premium Big Move + Quality + Regime Profit Mode calistir
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        run: python premium_big_move_profit_runner.py

      - name: Yeni acilan islemleri devam gucu shadow
        if: always()
        run: python position_continuation_shadow.py

      - name: Tum coin adaylarinda 4H cok gunluk trend omru shadow
        if: always()
        run: python multi_day_trend_shadow.py

      - name: Buyuk hareket erken yakalama ve tasima shadow
        if: always()
        run: python big_move_hunter_shadow.py

      - name: TP3 sonrasi runner degeri 6 saat shadow
        if: always()
        run: python tp3_runner_shadow.py

      - name: TP3 sonrasi 96 saat cok gunluk runner shadow
        if: always()
        run: python tp3_multi_day_runner_shadow.py

      - name: TP BE sonrasi sessiz takip
        if: always()
        run: python post_result_shadow.py

      - name: SL BE sonuc teshisi
        if: always()
        run: python result_diagnostics.py

      - name: Early Breakout LONG SHORT neden ayrimi shadow
        if: always()
        run: python early_breakout_direction_diagnostics.py

      - name: Golge state dosyalarini kompaktlastir
        if: always()
        run: python compact_shadow_states.py

      - name: Durum ve karlilik dosyalarini kaydet
        if: ${{ always() && github.ref_name == 'main' }}
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for file in \
            open_signals.json \
            performance.json \
            last_signals.json \
            trade_ledger.json \
            premium_pending_candidates.json \
            invalid_market_signals.json \
            premium_all_coins_state.json \
            smart_recovery_state.json \
            movement_start_shadow.json \
            movement_start_v2_shadow.json \
            movement_start_v3_orderflow_shadow.json \
            premium_early_breakout_state.json \
            premium_regime_transition_state.json \
            premium_quality_state.json \
            premium_big_move_state.json \
            big_move_false_positive_shadow.json \
            market_outlook_state.json \
            multi_day_trend_shadow.json \
            big_move_hunter_shadow.json \
            early_breakout_direction_diagnostics.json \
            profit_mode_report.json \
            profit_mode_rejections.json \
            portfolio_risk_shadow_main_mtf.json
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "Kaydedilecek degisiklik yok."
            exit 0
          fi

          git commit -m "Update Premium Profit Mode V4 All Coins state"

          for attempt in 1 2 3
          do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done

          exit 1