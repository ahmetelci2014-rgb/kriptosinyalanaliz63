name: Day Trading Core V1 - Live

on:
  # cron-job.org remains the external dispatcher. Each dispatch runs three
  # stateful scans so the trading engine sees an effective ~5 minute cadence.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: day-trading-core-v1-live
  cancel-in-progress: false

jobs:
  day-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: En guncel main state ile esitle
        if: ${{ github.ref_name == 'main' }}
        run: |
          set -e
          git fetch origin main
          git reset --hard origin/main
          echo "Day Trading run SHA: $(git rev-parse HEAD)"

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Paketleri kur
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --prefer-binary -r requirements.txt

      - name: Day Trading Core smoke check
        run: |
          set -e
          python -m py_compile \
            day_trading_core.py \
            day_trading_all_coins_runner.py \
            day_trading_candidate_tracker.py \
            day_trading_candidate_all_coins_runner.py \
            day_trading_4h_shadow.py
          python -m unittest -v test_day_trading_core.py test_day_trading_candidate_tracker.py

      - name: Day Trading - tum coinlerde 5 dakikalik uc stateful tarama
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          cycles=3
          target_interval=300

          for pass in $(seq 1 "$cycles")
          do
            cycle_started=$(date +%s)
            echo "===== DAY TRADING ALL COINS LIVE SCAN $pass/$cycles ====="
            python day_trading_all_coins_runner.py

            if [ "$pass" -lt "$cycles" ]; then
              cycle_finished=$(date +%s)
              elapsed=$((cycle_finished - cycle_started))
              sleep_for=$((target_interval - elapsed))
              if [ "$sleep_for" -gt 0 ]; then
                echo "Sonraki 5dk taramasina ${sleep_for}s kaldi."
                sleep "$sleep_for"
              else
                echo "Tum-coin taramasi 5dk penceresini asti; sonraki tarama hemen basliyor."
              fi
            fi
          done

      - name: Day Trading tum coin arka plan adaylarini kaydet ve takip et
        run: python day_trading_candidate_all_coins_runner.py

      - name: 4H uyumunu sadece arka planda olc
        run: python day_trading_4h_shadow.py

      - name: Day Trading state ve ledger kaydet
        if: ${{ always() && github.ref_name == 'main' }}
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for file in \
            day_trading_state.json \
            day_trading_ledger.json \
            day_trading_summary.json \
            day_trading_diagnostics.json \
            day_trading_candidate_ledger.json \
            day_trading_candidate_summary.json \
            day_trading_candidate_diagnostics.json \
            day_trading_4h_shadow_summary.json
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "Kaydedilecek day-trading degisikligi yok."
            exit 0
          fi

          git commit -m "Update Day Trading Core state"

          for attempt in 1 2 3
          do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done

          exit 1
