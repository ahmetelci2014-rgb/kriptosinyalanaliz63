name: Decision Engine Daily

on:
  workflow_dispatch:
  schedule:
    # 20:58 UTC = 23:58 Türkiye saati
    - cron: "58 20 * * *"

permissions:
  contents: write

concurrency:
  group: decision-engine-daily
  cancel-in-progress: false

jobs:
  decision-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Karar, reçete ve kalite motorlarını doğrula
        run: |
          python -m py_compile \
            decision_engine.py \
            test_decision_engine.py \
            prescription_engine.py \
            test_prescription_engine.py \
            signal_quality_audit.py \
            test_signal_quality_audit.py \
            tp_capacity_shadow.py \
            test_tp_capacity_shadow.py
          python test_decision_engine.py -v
          python test_prescription_engine.py -v
          python test_signal_quality_audit.py -v
          python test_tp_capacity_shadow.py -v

      - name: Karar raporunu üret
        run: |
          python decision_engine.py --output decision_report.json

      - name: Reçete raporunu üret
        run: |
          python prescription_engine.py --output prescription_report.json

      - name: Sinyal kalite raporunu üret
        run: |
          python signal_quality_audit.py --output signal_quality_audit.json

      - name: TP kapasite gölge raporunu üret
        run: |
          python tp_capacity_shadow.py --output tp_capacity_shadow_report.json

      - name: Karar, reçete ve kalite raporlarını kaydet
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for file in decision_report.json prescription_report.json signal_quality_audit.json tp_capacity_shadow_report.json
          do
            if [ ! -f "$file" ]; then
              echo "$file oluşmadı."
              exit 1
            fi
            git add "$file"
          done

          if git diff --cached --quiet; then
            echo "Karar/reçete/kalite raporunda yeni değişiklik yok."
            exit 0
          fi

          git commit -m "Update daily decision prescription and signal quality reports"

          for attempt in 1 2 3
          do
            echo "Push denemesi: $attempt"
            git pull --rebase --autostash origin main

            if git push origin HEAD:main; then
              echo "Karar, reçete ve kalite raporları kaydedildi."
              exit 0
            fi

            sleep 10
          done

          echo "Raporlar üç denemede de kaydedilemedi."
          exit 1
