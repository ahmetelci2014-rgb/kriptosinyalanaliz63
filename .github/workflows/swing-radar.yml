name: Swing Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "12,42 * * * *"

permissions:
  contents: write

concurrency:
  group: swing-radar
  cancel-in-progress: false

jobs:
  swing-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Swing radar çalıştır
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python swing_radar.py

      - name: Swing durum ve performans dosyalarını güvenli kaydet
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add             swing_radar_state.json             swing_performance_ledger.json

          if git diff --cached --quiet; then
            echo "Swing dosyalarında kaydedilecek değişiklik yok."
            exit 0
          fi

          git commit -m "Update swing state and performance ledger"

          for attempt in 1 2 3
          do
            echo "Push denemesi: $attempt"

            git pull --rebase --autostash origin main
            if git push origin HEAD:main
            then
              echo "Swing durum ve performans dosyaları kaydedildi."
              exit 0
            fi

            sleep 10
          done

          echo "Swing dosyaları üç denemede de kaydedilemedi."
          exit 1
