name: Swing V3 - Eski Kayit Takibi (Sessiz)

on:
  workflow_dispatch:
  schedule:
    - cron: "12 * * * *"

permissions:
  contents: write

concurrency:
  group: swing-v3-eski-kayit-takibi
  cancel-in-progress: false

jobs:
  eski-swing-kayitlarini-takip-et:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur ve pip onbellegini hazirla
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Paketleri kur
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --prefer-binary -r requirements.txt

      - name: Eski Swing V3 kayitlarini sessiz takip et
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python swing_radar.py

      - name: Eski Swing durum ve performans kayitlarini kaydet
        if: always()
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for file in \
            swing_radar_state.json \
            swing_performance_ledger.json \
            portfolio_risk_shadow.json
          do
            if [ -f "$file" ]; then
              git add "$file"
            else
              echo "$file henuz olusmamis; atlandi."
            fi
          done

          if git diff --cached --quiet; then
            echo "Eski Swing kayitlarinda kaydedilecek degisiklik yok."
            exit 0
          fi

          git commit -m "Update silent Swing V3 legacy tracking"

          for attempt in 1 2 3
          do
            echo "Push denemesi: $attempt"
            git pull --rebase --autostash origin main
            if git push origin HEAD:main
            then
              echo "Eski Swing kayitlari kaydedildi."
              exit 0
            fi
            sleep 10
          done

          echo "Eski Swing kayitlari uc denemede de kaydedilemedi."
          exit 1
