name: Kripto Panel Kontrolü

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard_*.py"
      - "test_dashboard_*.py"
      - "Dockerfile.dashboard"
      - ".dockerignore"
      - "render.yaml"
      - ".github/workflows/crypto-dashboard.yml"
  pull_request:
    branches: [main]
    paths:
      - "dashboard_*.py"
      - "test_dashboard_*.py"
      - "Dockerfile.dashboard"
      - ".dockerignore"
      - "render.yaml"
      - ".github/workflows/crypto-dashboard.yml"

permissions:
  contents: read

concurrency:
  group: crypto-dashboard-check
  cancel-in-progress: true

jobs:
  test-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Repo indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CANLI Render V3.32.6 yüzey paritesini doğrula
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          url = "https://kripto-kontrol-paneli.onrender.com/healthz"
          expected = {
              "version": "KRIPTO_KONTROL_MERKEZI_V3_32_6_SURFACE_PARITY_2026_08_16",
              "surface_audit": "desktop_mobile_unauth_free_premium_admin",
              "desktop_runtime": "V3.32.1 preserved",
              "mobile_runtime": "server_rendered_no_javascript",
              "mobile_navigation": "consistent_core",
              "mobile_filters": "server_rendered",
              "mobile_watchlist": "server_rendered_cookie_preference",
              "mobile_opportunities": "server_rendered_existing_analysis",
              "mobile_sound": "desktop_only_by_design",
              "mobile_chart": "svg_no_javascript",
              "mobile_account": "server_rendered_no_javascript",
              "mobile_premium": "server_rendered_existing_billing_backend",
              "mobile_free_premium_separated": True,
              "membership_backend": "unchanged",
              "payment_backend": "unchanged",
              "signal_engine": "unchanged",
              "telegram": "unchanged",
              "trade_management": "unchanged",
              "ledger_write": "unchanged",
          }
          last_error = None
          for attempt in range(18):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "github-actions-v3326-live-check"})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      assert response.status == 200, response.status
                      payload = json.loads(response.read().decode("utf-8"))
                  mismatches = {
                      key: (payload.get(key), value)
                      for key, value in expected.items()
                      if payload.get(key) != value
                  }
                  if not mismatches:
                      print("CANLI V3.32.6 doğrulandı:", json.dumps(payload, ensure_ascii=False, sort_keys=True))
                      break
                  last_error = f"health sözleşmesi henüz eşleşmedi: {mismatches}"
              except Exception as exc:
                  last_error = repr(exc)
              if attempt == 17:
                  raise SystemExit(f"CANLI Render V3.32.6 doğrulanamadı: {last_error}")
              time.sleep(10)
          PY
      - name: Panel Python dosyalarını derle
        run: python -m py_compile dashboard_*.py test_dashboard_*.py
      - name: Statik ve canlı panel testlerini çalıştır
        run: python -m unittest -v test_dashboard_*.py
      - name: Render Docker imajını doğrula
        run: docker build -f Dockerfile.dashboard -t kripto-panel-ci .
      - name: Gerçek verilerden panel üret
        run: python dashboard_builder.py --root . --output dashboard_output/index.html
      - name: Acil durum statik yedeğini yükle
        uses: actions/upload-artifact@v4
        with:
          name: kripto-panel-statik-yedek
          path: dashboard_output/index.html
          if-no-files-found: error
          retention-days: 3
      - name: Kullanım özetini yaz
        run: |
          ACTIVE_VERSION="$(python -c 'import dashboard_app as app; print(app.VERSION)')"
          ACTIVE_MODULE="$(python -c 'import dashboard_app as app; print(app.ACTIVE_MODULE)')"
          {
            echo "## Kripto Kontrol Paneli doğrulandı"
            echo ""
            echo "- Aktif panel sürümü: ${ACTIVE_VERSION}"
            echo "- Sabit Docker giriş noktası: dashboard_app.py -> ${ACTIVE_MODULE}"
            echo "- Gerçek şablon ürün sözleşmesi ve tüm dashboard regresyon testleri başarılı"
            echo "- Piyasa Merkezi hızlı keşif/karşılaştırma, Coin Merkezi Premium derin inceleme olarak ayrıdır"
            echo "- FREE / PREMIUM / ADMIN erişim sınırları korunur"
            echo "- Premium bitiş, yenileme, ödeme geçmişi ve yönetim akışları korunur"
            echo "- Premium API uçları FREE kullanıcıya sunucu tarafında kapalı kalır"
            echo "- Mobil ve masaüstü ürün akışı korunur"
            echo "- Sinyal/strateji davranışı değişmez"
            echo "- Telegram gönderim mantığı değişmez"
            echo "- Private GitHub anahtarları yalnız sunucu tarafında"
            echo "- Kullanıcı şifreleri yalnız PBKDF2 özet olarak saklanır"
            echo "- Emir açma yok"
            echo ""
            echo "Artifact yalnız acil durum anlık görüntüsüdür; canlı panel değildir."
          } >> "$GITHUB_STEP_SUMMARY"
