name: Kripto Panel Kontrolü

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard_*.py"
      - "test_dashboard_*.py"
      - "Dockerfile.dashboard"
      - ".dockerignore"
      - "render.yaml"
      - ".github/workflows/crypto-dashboard.yml"
  pull_request:
    branches: [main]
    paths:
      - "dashboard_*.py"
      - "test_dashboard_*.py"
      - "Dockerfile.dashboard"
      - ".dockerignore"
      - "render.yaml"
      - ".github/workflows/crypto-dashboard.yml"

permissions:
  contents: read

concurrency:
  group: crypto-dashboard-check
  cancel-in-progress: true

jobs:
  test-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Repo indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CANLI Render V3.32.9 paylaşım kartlarını doğrula
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          url = "https://kripto-kontrol-paneli.onrender.com/healthz"
          expected = {
              "status": "ok",
              "version": "KRIPTO_KONTROL_MERKEZI_V3_32_9_SHARE_CARDS_2026_08_17",
              "base_runtime": "V3.32.8 preserved",
              "share_cards": "premium_admin_real_trade_data",
              "share_buttons": "signals_trades_results_desktop_mobile",
              "share_chart": "public_15m_candles_server_svg",
              "share_png": "browser_export_web_share_download_fallback",
              "share_results": "tp_sl_be_supported",
              "share_free": "blocked",
              "share_user_identity": "not_rendered",
              "mobile_runtime": "server_rendered_core_preserved",
              "membership_backend": "V3.32.8 preserved",
              "payment_backend": "unchanged",
              "signal_engine": "unchanged",
              "telegram": "unchanged",
              "trade_management": "unchanged",
              "ledger_write": "unchanged",
          }
          last = None
          for attempt in range(30):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "github-v3329-live-check"})
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      last = json.loads(resp.read().decode("utf-8"))
                  bad = {k: (last.get(k), v) for k, v in expected.items() if last.get(k) != v}
                  if not bad:
                      print("CANLI_RENDER_V3329_OK", last["version"])
                      break
                  print(f"attempt={attempt+1} henüz beklenen sürüm değil: {bad}")
              except Exception as exc:
                  print(f"attempt={attempt+1} canlı kontrol hatası: {exc}")
              time.sleep(8)
          else:
              raise SystemExit(f"Canlı Render V3.32.9 doğrulanamadı. Son yanıt: {last}")
          PY
      - name: Panel Python dosyalarını derle
        run: python -m py_compile dashboard_*.py test_dashboard_*.py
      - name: Statik ve canlı panel testlerini çalıştır
        run: python -m unittest -v test_dashboard_*.py
      - name: Render Docker imajını doğrula
        run: docker build -f Dockerfile.dashboard -t kripto-panel-ci .
      - name: Gerçek verilerden panel üret
        run: python dashboard_builder.py --root . --output dashboard_output/index.html
      - name: Acil durum statik yedeğini yükle
        uses: actions/upload-artifact@v4
        with:
          name: kripto-panel-statik-yedek
          path: dashboard_output/index.html
          if-no-files-found: error
          retention-days: 3
      - name: Kullanım özetini yaz
        run: |
          ACTIVE_VERSION="$(python -c 'import dashboard_app as app; print(app.VERSION)')"
          ACTIVE_MODULE="$(python -c 'import dashboard_app as app; print(app.ACTIVE_MODULE)')"
          {
            echo "## Kripto Kontrol Paneli doğrulandı"
            echo ""
            echo "- Aktif panel sürümü: ${ACTIVE_VERSION}"
            echo "- Sabit Docker giriş noktası: dashboard_app.py -> ${ACTIVE_MODULE}"
            echo "- Gerçek şablon ürün sözleşmesi ve tüm dashboard regresyon testleri başarılı"
            echo "- Piyasa Merkezi hızlı keşif/karşılaştırma, Coin Merkezi Premium derin inceleme olarak ayrıdır"
            echo "- FREE / PREMIUM / ADMIN erişim sınırları korunur"
            echo "- Premium bitiş, yenileme, ödeme geçmişi ve yönetim akışları korunur"
            echo "- Premium API uçları FREE kullanıcıya sunucu tarafında kapalı kalır"
            echo "- Mobil ve masaüstü ürün akışı korunur"
            echo "- Sinyal/strateji davranışı değişmez"
            echo "- Telegram gönderim mantığı değişmez"
            echo "- Private GitHub anahtarları yalnız sunucu tarafında"
            echo "- Kullanıcı şifreleri yalnız PBKDF2 özet olarak saklanır"
            echo "- Emir açma yok"
            echo ""
            echo "Artifact yalnız acil durum anlık görüntüsüdür; canlı panel değildir."
          } >> "$GITHUB_STEP_SUMMARY"
