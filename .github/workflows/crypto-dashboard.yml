permissions:
  contents: read

concurrency:
  group: crypto-dashboard-check
  cancel-in-progress: true

jobs:
  test-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Repo indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Panel Python dosyalarını derle
        run: |
          python -m py_compile \
            dashboard_builder.py dashboard_live_app.py dashboard_accounts_app.py dashboard_product_app.py \
            dashboard_market_app.py dashboard_compact_app.py dashboard_focus_app.py dashboard_focus_market_app.py \
            dashboard_home_app.py dashboard_notify_app.py dashboard_alert_app.py dashboard_watchlist_app.py \
            dashboard_opportunity_app.py dashboard_score_app.py dashboard_filter_app.py dashboard_route_app.py dashboard_memory_app.py dashboard_commercial_app.py dashboard_billing_app.py dashboard_adminux_app.py dashboard_freepreview_app.py dashboard_transparency_app.py dashboard_quality_app.py dashboard_quality_runtime_app.py dashboard_business_app.py \
            test_dashboard_builder.py test_dashboard_live_app.py test_dashboard_accounts_app.py test_dashboard_product_app.py \
            test_dashboard_market_app.py test_dashboard_compact_app.py test_dashboard_focus_app.py test_dashboard_home_app.py \
            test_dashboard_notify_app.py test_dashboard_alert_app.py test_dashboard_watchlist_app.py test_dashboard_opportunity_app.py \
            test_dashboard_score_app.py test_dashboard_filter_app.py test_dashboard_route_app.py test_dashboard_memory_app.py test_dashboard_commercial_app.py test_dashboard_billing_app.py test_dashboard_adminux_app.py test_dashboard_freepreview_app.py test_dashboard_transparency_app.py test_dashboard_quality_app.py test_dashboard_quality_runtime_app.py test_dashboard_business_app.py
      - name: Statik ve canlı panel testlerini çalıştır
        run: |
          python -m unittest -v \
            test_dashboard_builder.py test_dashboard_live_app.py test_dashboard_accounts_app.py test_dashboard_product_app.py \
            test_dashboard_market_app.py test_dashboard_compact_app.py test_dashboard_focus_app.py test_dashboard_home_app.py \
            test_dashboard_notify_app.py test_dashboard_alert_app.py test_dashboard_watchlist_app.py test_dashboard_opportunity_app.py \
            test_dashboard_score_app.py test_dashboard_filter_app.py test_dashboard_route_app.py test_dashboard_memory_app.py test_dashboard_commercial_app.py test_dashboard_billing_app.py test_dashboard_adminux_app.py test_dashboard_freepreview_app.py test_dashboard_transparency_app.py test_dashboard_quality_app.py test_dashboard_quality_runtime_app.py test_dashboard_business_app.py
      - name: Render Docker imajını doğrula
        run: docker build -f Dockerfile.dashboard -t kripto-panel-ci .
      - name: Gerçek verilerden panel üret
        run: python dashboard_builder.py --root . --output dashboard_output/index.html
      - name: Acil durum statik yedeğini yükle
        uses: actions/upload-artifact@v4
        with:
          name: kripto-panel-statik-yedek
          path: dashboard_output/index.html
          if-no-files-found: error
          retention-days: 3
      - name: Kullanım özetini yaz
        run: |
          {
            echo "## Kripto Kontrol Paneli doğrulandı"
            echo ""
            echo "V3.6 Premium Satış + İşletme Kalitesi dahil canlı panel ve Docker build testleri başarılı."
            echo "Artifact yalnız acil durum anlık görüntüsüdür; canlı panel değildir."
            echo ""
            echo "- Premium sayfası paket/fiyat/süre, canlı güvenli ürün özeti, özellikler ve üyelik adımlarını net gösterir"
            echo "- Mevcut manuel ödeme bildirimi ve yönetici onay akışı değişmeden korunur"
            echo "- Premium satış ekranında işlem seviyesi veya hassas kullanıcı verisi açığa çıkarılmaz"
            echo "- Yönetim Merkezi müşteri sayısı, Premium dönüşüm, yeni kullanıcı, bekleyen ödeme ve 7 gün içinde bitecek üyelikleri gösterir"
            echo "- Gelir/ciro tutarı veri modeli desteklemediği için uydurulmaz"
            echo "- V3.5 açık vitrin, FREE gerçek sinyal, şeffaf sonuç ve kota bandı korunur"
            echo "- Premium API uçları FREE kullanıcıya sunucu tarafında kapalı kalır"
            echo "- Mobil ve masaüstü Çıkış ile Yönetim Merkezi korunur"
            echo "- Sinyal/strateji davranışı değişmez"
            echo "- Telegram gönderim mantığı değişmez"
            echo "- Private GitHub anahtarları yalnız sunucu tarafında"
            echo "- Kullanıcı şifreleri yalnız PBKDF2 özet olarak saklanır"
            echo "- Emir açma yok"
          } >> "$GITHUB_STEP_SUMMARY"
