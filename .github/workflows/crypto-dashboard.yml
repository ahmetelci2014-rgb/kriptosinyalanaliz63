      - "test_dashboard_opportunity_app.py"
      - "test_dashboard_score_app.py"
      - "test_dashboard_filter_app.py"
      - "test_dashboard_route_app.py"
      - "test_dashboard_memory_app.py"
      - "test_dashboard_commercial_app.py"
      - "test_dashboard_billing_app.py"
      - "test_dashboard_adminux_app.py"
      - "test_dashboard_freepreview_app.py"
      - "test_dashboard_transparency_app.py"
      - "test_dashboard_quality_app.py"
      - "Dockerfile.dashboard"
      - ".dockerignore"
      - "render.yaml"
      - ".github/workflows/crypto-dashboard.yml"

permissions:
  contents: read

concurrency:
  group: crypto-dashboard-check
  cancel-in-progress: true

jobs:
  test-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Repo indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Panel Python dosyalarını derle
        run: |
          python -m py_compile \
            dashboard_builder.py dashboard_live_app.py dashboard_accounts_app.py dashboard_product_app.py \
            dashboard_market_app.py dashboard_compact_app.py dashboard_focus_app.py dashboard_focus_market_app.py \
            dashboard_home_app.py dashboard_notify_app.py dashboard_alert_app.py dashboard_watchlist_app.py \
            dashboard_opportunity_app.py dashboard_score_app.py dashboard_filter_app.py dashboard_route_app.py dashboard_memory_app.py dashboard_commercial_app.py dashboard_billing_app.py dashboard_adminux_app.py dashboard_freepreview_app.py dashboard_transparency_app.py dashboard_quality_app.py \
            test_dashboard_builder.py test_dashboard_live_app.py test_dashboard_accounts_app.py test_dashboard_product_app.py \
            test_dashboard_market_app.py test_dashboard_compact_app.py test_dashboard_focus_app.py test_dashboard_home_app.py \
            test_dashboard_notify_app.py test_dashboard_alert_app.py test_dashboard_watchlist_app.py test_dashboard_opportunity_app.py \
            test_dashboard_score_app.py test_dashboard_filter_app.py test_dashboard_route_app.py test_dashboard_memory_app.py test_dashboard_commercial_app.py test_dashboard_billing_app.py test_dashboard_adminux_app.py test_dashboard_freepreview_app.py test_dashboard_transparency_app.py test_dashboard_quality_app.py
      - name: Statik ve canlı panel testlerini çalıştır
        run: |
          python -m unittest -v \
            test_dashboard_builder.py test_dashboard_live_app.py test_dashboard_accounts_app.py test_dashboard_product_app.py \
            test_dashboard_market_app.py test_dashboard_compact_app.py test_dashboard_focus_app.py test_dashboard_home_app.py \
            test_dashboard_notify_app.py test_dashboard_alert_app.py test_dashboard_watchlist_app.py test_dashboard_opportunity_app.py \
            test_dashboard_score_app.py test_dashboard_filter_app.py test_dashboard_route_app.py test_dashboard_memory_app.py test_dashboard_commercial_app.py test_dashboard_billing_app.py test_dashboard_adminux_app.py test_dashboard_freepreview_app.py test_dashboard_transparency_app.py test_dashboard_quality_app.py
      - name: Render Docker imajını doğrula
        run: docker build -f Dockerfile.dashboard -t kripto-panel-ci .
      - name: Gerçek verilerden panel üret
        run: python dashboard_builder.py --root . --output dashboard_output/index.html
      - name: Acil durum statik yedeğini yükle
        uses: actions/upload-artifact@v4
        with:
          name: kripto-panel-statik-yedek
          path: dashboard_output/index.html
          if-no-files-found: error
          retention-days: 3
      - name: Kullanım özetini yaz
        run: |
          {
            echo "## Kripto Kontrol Paneli doğrulandı"
            echo ""
            echo "V3.5 Ürün Kalitesi + Satış Dönüşümü dahil canlı panel ve Docker build testleri başarılı."
            echo "Artifact yalnız acil durum anlık görüntüsüdür; canlı panel değildir."
            echo ""
            echo "- Girişsiz vitrin canlı güven bandı, şeffaf sonuçlar ve FREE/PREMIUM karşılaştırması gösterir"
            echo "- Premium paket adı/süre/fiyatı ortam ayarlarından güvenli biçimde gösterilir"
            echo "- Public ürün payload'ında Entry/TP/SL/skor, kullanıcı veya ödeme talimatı bulunmaz"
            echo "- Açık işlemler yalnız adet olarak FREE görünür / Premium kilitli şeklinde özetlenir"
            echo "- FREE kullanıcı aynı anda 1 gerçek açık sinyali Entry + TP1 + SL ile görmeye devam eder"
            echo "- FREE sonuç takibi ve V3.4 şeffaf kronolojik sonuç akışı korunur"
            echo "- Mobil satış/üyelik çağrıları ürün kullanımını engellemeyecek şekilde eklenir"
            echo "- Premium API uçları FREE kullanıcıya sunucu tarafında kapalı kalır"
            echo "- Mobil ve masaüstü Çıkış ile Yönetim Merkezi korunur"
            echo "- Sinyal/strateji davranışı değişmez"
            echo "- Telegram gönderim mantığı değişmez"
            echo "- Private GitHub anahtarları yalnız sunucu tarafında"
            echo "- Kullanıcı şifreleri yalnız PBKDF2 özet olarak saklanır"
            echo "- Emir açma yok"
          } >> "$GITHUB_STEP_SUMMARY"
