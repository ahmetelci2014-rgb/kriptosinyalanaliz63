name: Kripto Panel Kontrolü

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "dashboard_builder.py"
      - "dashboard_live_app.py"
      - "dashboard_accounts_app.py"
      - "dashboard_product_app.py"
      - "dashboard_market_app.py"
      - "dashboard_compact_app.py"
      - "dashboard_focus_app.py"
      - "dashboard_focus_market_app.py"
      - "dashboard_home_app.py"
      - "dashboard_notify_app.py"
      - "dashboard_alert_app.py"
      - "dashboard_watchlist_app.py"
      - "dashboard_opportunity_app.py"
      - "dashboard_score_app.py"
      - "test_dashboard_builder.py"
      - "test_dashboard_live_app.py"
      - "test_dashboard_accounts_app.py"
      - "test_dashboard_product_app.py"
      - "test_dashboard_market_app.py"
      - "test_dashboard_compact_app.py"
      - "test_dashboard_focus_app.py"
      - "test_dashboard_home_app.py"
      - "test_dashboard_notify_app.py"
      - "test_dashboard_alert_app.py"
      - "test_dashboard_watchlist_app.py"
      - "test_dashboard_opportunity_app.py"
      - "test_dashboard_score_app.py"
      - "Dockerfile.dashboard"
      - ".dockerignore"
      - "render.yaml"
      - ".github/workflows/crypto-dashboard.yml"
  pull_request:
    branches:
      - main
    paths:
      - "dashboard_builder.py"
      - "dashboard_live_app.py"
      - "dashboard_accounts_app.py"
      - "dashboard_product_app.py"
      - "dashboard_market_app.py"
      - "dashboard_compact_app.py"
      - "dashboard_focus_app.py"
      - "dashboard_focus_market_app.py"
      - "dashboard_home_app.py"
      - "dashboard_notify_app.py"
      - "dashboard_alert_app.py"
      - "dashboard_watchlist_app.py"
      - "dashboard_opportunity_app.py"
      - "dashboard_score_app.py"
      - "test_dashboard_builder.py"
      - "test_dashboard_live_app.py"
      - "test_dashboard_accounts_app.py"
      - "test_dashboard_product_app.py"
      - "test_dashboard_market_app.py"
      - "test_dashboard_compact_app.py"
      - "test_dashboard_focus_app.py"
      - "test_dashboard_home_app.py"
      - "test_dashboard_notify_app.py"
      - "test_dashboard_alert_app.py"
      - "test_dashboard_watchlist_app.py"
      - "test_dashboard_opportunity_app.py"
      - "test_dashboard_score_app.py"
      - "Dockerfile.dashboard"
      - ".dockerignore"
      - "render.yaml"
      - ".github/workflows/crypto-dashboard.yml"

permissions:
  contents: read

concurrency:
  group: crypto-dashboard-check
  cancel-in-progress: true

jobs:
  test-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Repo indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Panel Python dosyalarını derle
        run: |
          python -m py_compile \
            dashboard_builder.py \
            dashboard_live_app.py \
            dashboard_accounts_app.py \
            dashboard_product_app.py \
            dashboard_market_app.py \
            dashboard_compact_app.py \
            dashboard_focus_app.py \
            dashboard_focus_market_app.py \
            dashboard_home_app.py \
            dashboard_notify_app.py \
            dashboard_alert_app.py \
            dashboard_watchlist_app.py \
            dashboard_opportunity_app.py \
            dashboard_score_app.py \
            test_dashboard_builder.py \
            test_dashboard_live_app.py \
            test_dashboard_accounts_app.py \
            test_dashboard_product_app.py \
            test_dashboard_market_app.py \
            test_dashboard_compact_app.py \
            test_dashboard_focus_app.py \
            test_dashboard_home_app.py \
            test_dashboard_notify_app.py \
            test_dashboard_alert_app.py \
            test_dashboard_watchlist_app.py \
            test_dashboard_opportunity_app.py \
            test_dashboard_score_app.py

      - name: Statik ve canlı panel testlerini çalıştır
        run: |
          python -m unittest -v \
            test_dashboard_builder.py \
            test_dashboard_live_app.py \
            test_dashboard_accounts_app.py \
            test_dashboard_product_app.py \
            test_dashboard_market_app.py \
            test_dashboard_compact_app.py \
            test_dashboard_focus_app.py \
            test_dashboard_home_app.py \
            test_dashboard_notify_app.py \
            test_dashboard_alert_app.py \
            test_dashboard_watchlist_app.py \
            test_dashboard_opportunity_app.py \
            test_dashboard_score_app.py

      - name: Render Docker imajını doğrula
        run: docker build -f Dockerfile.dashboard -t kripto-panel-ci .

      - name: Gerçek verilerden panel üret
        run: python dashboard_builder.py --root . --output dashboard_output/index.html

      - name: Acil durum statik yedeğini yükle
        uses: actions/upload-artifact@v4
        with:
          name: kripto-panel-statik-yedek
          path: dashboard_output/index.html
          if-no-files-found: error
          retention-days: 3

      - name: Kullanım özetini yaz
        run: |
          {
            echo "## Kripto Kontrol Paneli doğrulandı"
            echo ""
            echo "V2.7 İnceleme Skoru, V2.6 Piyasa Fırsat Merkezi, V2.5 İzleme Listesi, sesli/renkli canlı uyarı, Bildirim Merkezi, akıllı ana sayfa, hızlı coin analiz çekmecesi, üyelik/yönetim, canlı piyasa merkezi ve Docker build testleri başarılı."
            echo "Artifact yalnız acil durum anlık görüntüsüdür; canlı panel değildir."
            echo ""
            echo "- Sinyal/strateji davranışı değişmez"
            echo "- Telegram gönderim mantığı değişmez"
            echo "- İnceleme Skoru 15m + 1H EMA trend, RSI, 15m hacim oranı ve 24s momentumdan hesaplanır"
            echo "- İnceleme Skoru başarı ihtimali veya yeni işlem sinyali değildir"
            echo "- Skor verisi OKX public veriden gelir ve sunucuda kısa süre önbelleklenir"
            echo "- Piyasa Fırsat Merkezi yalnız OKX public piyasa verisini sınıflandırır"
            echo "- Fırsat grupları yeni işlem sinyali değildir ve emir açmaz"
            echo "- İzleme Listesi favorileri yalnız tarayıcı localStorage alanındadır"
            echo "- Sesli uyarı kullanıcı tarafından açılır ve yalnız tarayıcı Web Audio kullanır"
            echo "- Renkli toast uyarıları yalnız mevcut panel verilerinden üretilir"
            echo "- Eski ayrıntılı panel /advanced altında korunur"
            echo "- Private GitHub anahtarları yalnız sunucu tarafında"
            echo "- Kullanıcı şifreleri yalnız PBKDF2 özet olarak saklanır"
            echo "- Emir açma yok"
          } >> "$GITHUB_STEP_SUMMARY"
