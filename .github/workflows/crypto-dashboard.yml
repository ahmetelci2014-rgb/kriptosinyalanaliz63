name: Kripto Panel Kontrolü

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard_*.py"
      - "test_dashboard_*.py"
      - "Dockerfile.dashboard"
      - ".dockerignore"
      - "render.yaml"
      - ".github/workflows/crypto-dashboard.yml"
  pull_request:
    branches: [main]
    paths:
      - "dashboard_*.py"
      - "test_dashboard_*.py"
      - "Dockerfile.dashboard"
      - ".dockerignore"
      - "render.yaml"
      - ".github/workflows/crypto-dashboard.yml"

permissions:
  contents: read

concurrency:
  group: crypto-dashboard-check
  cancel-in-progress: true

jobs:
  test-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Repo indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Panel Python dosyalarını derle
        run: python -m py_compile dashboard_*.py test_dashboard_*.py
      - name: Statik ve canlı panel testlerini çalıştır
        run: python -m unittest -v test_dashboard_*.py
      - name: Render Docker imajını doğrula
        run: docker build -f Dockerfile.dashboard -t kripto-panel-ci .
      - name: Gerçek verilerden panel üret
        run: python dashboard_builder.py --root . --output dashboard_output/index.html
      - name: Acil durum statik yedeğini yükle
        uses: actions/upload-artifact@v4
        with:
          name: kripto-panel-statik-yedek
          path: dashboard_output/index.html
          if-no-files-found: error
          retention-days: 3
      - name: Kullanım özetini yaz
        run: |
          {
            echo "## Kripto Kontrol Paneli doğrulandı"
            echo ""
            echo "V3.8 Yenileme + Müşteri Tutundurma dahil canlı panel ve Docker build testleri başarılı."
            echo "Artifact yalnız acil durum anlık görüntüsüdür; canlı panel değildir."
            echo ""
            echo "- Premium bitişine 7/3/1 gün kala kullanıcı panelinde yenileme uyarısı gösterilir"
            echo "- Son 7 günde aktif Premium kullanıcı mevcut ödeme bildirimiyle üyeliğini yenileyebilir"
            echo "- Onaylanan yenileme mevcut bitiş tarihinin üzerine süre ekler"
            echo "- Bekleyen ödeme varken ikinci yenileme bildirimi engellenir"
            echo "- Süresi biten hesap kapanmaz; FREE planla devam eder ve yenileme çağrısı görür"
            echo "- Admin Yenileme Merkezi ödeme, süresi biten ve 1/3/7 gün içinde bitecek kullanıcıları önceliklendirir"
            echo "- V3.7 Müşteri Yaşam Döngüsü ve hızlı +30/+90 gün yönetimi korunur"
            echo "- Premium satış, FREE gerçek sinyal, şeffaf sonuç ve kota bandı korunur"
            echo "- Premium API uçları FREE kullanıcıya sunucu tarafında kapalı kalır"
            echo "- Mobil ve masaüstü Çıkış ile Yönetim Merkezi korunur"
            echo "- Sinyal/strateji davranışı değişmez"
            echo "- Telegram gönderim mantığı değişmez"
            echo "- Private GitHub anahtarları yalnız sunucu tarafında"
            echo "- Kullanıcı şifreleri yalnız PBKDF2 özet olarak saklanır"
            echo "- Emir açma yok"
          } >> "$GITHUB_STEP_SUMMARY"
