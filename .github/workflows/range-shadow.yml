name: Range Cycle Shadow v2

on:
  workflow_dispatch:
  schedule:
    - cron: "1-56/5 * * * *"

permissions:
  contents: write

concurrency:
  group: range-cycle-shadow-v2
  cancel-in-progress: false

jobs:
  range-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Bağımlılıkları kur
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --prefer-binary -r requirements.txt

      - name: Range motorunu doğrula
        run: |
          python -m py_compile range_shadow.py test_range_shadow.py
          python range_shadow.py --self-test
          python test_range_shadow.py -v

      - name: Range bant döngü analizini çalıştır
        run: python range_shadow.py

      - name: Range gölge ledgerını kaydet
        if: always()
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -f "range_shadow.json" ]; then
            git add range_shadow.json
          else
            echo "range_shadow.json oluşmadı."
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Range gölge ledgerında yeni değişiklik yok."
            exit 0
          fi

          git commit -m "Update range cycle shadow ledger"

          for attempt in 1 2 3
          do
            echo "Push denemesi: $attempt"
            git pull --rebase --autostash origin main

            if git push origin HEAD:main; then
              echo "Range gölge ledgerı kaydedildi."
              exit 0
            fi

            sleep 10
          done

          echo "Range gölge ledgerı üç denemede de kaydedilemedi."
          exit 1
