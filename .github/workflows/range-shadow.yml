name: Range Cycle Shadow V4

on:
  workflow_dispatch:
  schedule:
    # V4 her tur bütün aktif lineer USDT perpetual evrenini tarar.
    # Range yapısı yavaş değiştiği için 4 saatlik örnekleme korunur.
    - cron: "23 0,4,8,12,16,20 * * *"

permissions:
  contents: write

concurrency:
  group: range-cycle-shadow-v4
  cancel-in-progress: false

jobs:
  range-shadow-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Bağımlılıkları kur
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --prefer-binary -r requirements.txt

      - name: Range V4 motorunu doğrula
        run: |
          python -m py_compile range_shadow.py range_shadow_v4_runner.py test_range_shadow.py
          python test_range_shadow.py -v
          python range_shadow_v4_runner.py --self-test

      - name: Range V4 bant döngü analizini çalıştır
        run: python range_shadow_v4_runner.py

      - name: Range V4 gölge ledgerını kaydet
        if: always()
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -f "range_shadow_v4.json" ]; then
            git add range_shadow_v4.json
          else
            echo "range_shadow_v4.json oluşmadı."
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Range V4 gölge ledgerında yeni değişiklik yok."
            exit 0
          fi

          git commit -m "Update Range Shadow V4 ledger"

          for attempt in 1 2 3
          do
            echo "Push denemesi: $attempt"
            git pull --rebase --autostash origin main

            if git push origin HEAD:main; then
              echo "Range V4 gölge ledgerı kaydedildi."
              exit 0
            fi

            sleep 10
          done

          echo "Range V4 gölge ledgerı üç denemede de kaydedilemedi."
          exit 1
