name: Trigger One-time Scalp Quality Maintenance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/maintenance-scalp-quality-shadow-trigger.yml"

permissions:
  contents: write

concurrency:
  group: trigger-one-time-scalp-quality-maintenance
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Hazırlanmış patch scriptini uygula
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path(".github/workflows/maintenance-scalp-quality-shadow.yml").read_text(encoding="utf-8")
          marker = "python - <<'PY'\n"
          if marker not in source:
              raise SystemExit("Bakım patch scripti bulunamadı")
          script = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(script), "maintenance-scalp-quality-shadow", "exec"), {})
          PY
      - name: Derleme ve temel güvenlik doğrulaması
        run: |
          python -m py_compile scalp_radar.py
          python - <<'PY'
          import os
          import tempfile
          import scalp_radar as radar

          assert radar.ATTACK_LONG_MIN_CLOSE_POWER == 70
          assert radar.ATTACK_SHORT_MAX_CLOSE_POWER == 30
          assert radar.ATTACK_LEGACY_LONG_MIN_CLOSE_POWER == 62
          assert radar.ATTACK_LEGACY_SHORT_MAX_CLOSE_POWER == 38
          assert hasattr(radar, "record_attack_guard_shadow_candidate")
          assert hasattr(radar, "update_attack_guard_shadow")

          with tempfile.TemporaryDirectory() as tmp:
              radar.ATTACK_GUARD_SHADOW_FILE = os.path.join(tmp, "shadow.json")
              item = {
                  "counterfactual_attack_guard": True,
                  "symbol": "TESTUSDT",
                  "direction": "LONG",
                  "entry": 100.0,
                  "sl": 99.0,
                  "risk_percent": 1.0,
                  "close_power": 65.0,
                  "legacy_score": 90,
                  "live_score": 80,
                  "legacy_close_power_threshold": 62,
                  "live_close_power_threshold": 70,
                  "rsi1": 60,
                  "rsi5": 58,
                  "vol1": 2.0,
                  "vol5": 1.5,
                  "move1": 0.2,
                  "move5": 0.5,
                  "move15": 0.3,
                  "breakout": True,
              }
              rid = radar.record_attack_guard_shadow_candidate(item)
              assert rid
              data = radar.load_attack_guard_shadow()
              rec = data["records"][0]
              base = int(rec["created_at"])
              radar.fetch_candles_since = lambda *a, **k: [
                  {"time": base + 60, "open": 100.0, "high": 100.8, "low": 99.8, "close": 100.5, "volume": 1.0},
                  {"time": base + 120, "open": 100.5, "high": 101.8, "low": 100.2, "close": 101.7, "volume": 1.0},
              ]
              radar.update_attack_guard_shadow(object())
              data = radar.load_attack_guard_shadow()
              rec = data["records"][0]
              assert rec["tp1_hit"] is True
              assert rec["tp3_hit"] is True
              assert rec["outcome"] == "TP3"
              assert data["summary"]["auto_apply"] is False
          print("Scalp quality shadow validation OK")
          PY
      - name: Geçici bakım dosyalarını kaldır ve kaydet
        run: |
          set -e
          rm -f \
            .github/workflows/maintenance-scalp-quality-shadow.yml \
            .github/workflows/maintenance-scalp-quality-shadow-trigger.yml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add \
            scalp_radar.py \
            .github/workflows/scalp-radar.yml \
            .github/workflows/maintenance-scalp-quality-shadow.yml \
            .github/workflows/maintenance-scalp-quality-shadow-trigger.yml
          git commit -m "Add scalp attack guard counterfactual shadow"
          for attempt in 1 2 3
          do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done
          exit 1
