name: Coin Detay Analizi

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Analiz edilecek coin. Örnek: BTCUSDT, SOLUSDT, API3USDT"
        required: true
        default: "BTCUSDT"

permissions:
  contents: read

concurrency:
  group: coin-detail-analysis
  cancel-in-progress: false

jobs:
  coin-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: En güncel main ile eşitle
        run: |
          set -e
          git fetch origin main
          git reset --hard origin/main
          echo "Coin Analysis SHA: $(git rev-parse HEAD)"

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Paketleri kur
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --prefer-binary -r requirements.txt

      - name: Coin Analyzer import ve syntax kontrolü
        run: |
          python -m py_compile coin_analyzer.py coin_analysis_runtime.py
          python -c "import coin_analyzer; print('Coin Analyzer import OK:', coin_analyzer.VERSION)"

      - name: Coin Detay Analizi çalıştır
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SYMBOL: ${{ github.event.inputs.symbol }}
          PYTHONUNBUFFERED: "1"
        run: python coin_analysis_runtime.py
