name: Premium Core Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

concurrency:
  group: premium-core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repo indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Bagimliliklari kur
        run: |
          python -m pip install --prefer-binary -r requirements.txt
          python -m pip install "pytest>=8,<10"

      - name: Premium cekirdek dosyalarini kontrol et
        run: |
          test -f main.py
          test -f strategy.py
          test -f config.py
          test -f premium_crypto_profit_runner.py
          test -f premium_profit_runner.py
          test -f premium_early_breakout.py
          test -f position_continuation_shadow.py
          test -f tp3_runner_shadow.py
          test -f multi_day_trend_shadow.py
          test -f tp3_multi_day_runner_shadow.py
          test -f premium_all_coins.py
          test -f premium_confirmation.py
          test -f premium_continuation.py
          test -f premium_reversal_capture.py
          test -f profitability_engine.py
          test -f portfolio_risk.py
          test -f opportunity_capture.py
          test -f live_entry_safety.py
          test -f coin_analyzer.py
          test -f coin_analysis_runtime.py
          test -f coin_analysis_runtime_v2.py
          test -f movement_start_shadow.py
          test -f movement_start_v2_shadow.py
          test -f movement_start_v3_orderflow_shadow.py
          test -f post_result_shadow.py
          test -f result_diagnostics.py

      - name: Premium cekirdegi derle
        run: |
          python -m py_compile \
            main.py \
            strategy.py \
            config.py \
            premium_crypto_profit_runner.py \
            premium_profit_runner.py \
            premium_early_breakout.py \
            position_continuation_shadow.py \
            tp3_runner_shadow.py \
            multi_day_trend_shadow.py \
            tp3_multi_day_runner_shadow.py \
            premium_all_coins.py \
            premium_confirmation.py \
            premium_continuation.py \
            premium_reversal_capture.py \
            profitability_engine.py \
            portfolio_risk.py \
            opportunity_capture.py \
            live_entry_safety.py \
            coin_analyzer.py \
            coin_analysis_runtime.py \
            coin_analysis_runtime_v2.py \
            movement_start_shadow.py \
            movement_start_v2_shadow.py \
            movement_start_v3_orderflow_shadow.py \
            post_result_shadow.py \
            result_diagnostics.py

      - name: Mevcut regresyon testlerini calistir
        env:
          TOKEN: ""
          CHAT_ID: ""
        run: |
          for test_file in test_*.py
          do
            echo "Calistiriliyor: ${test_file}"
            python -m pytest -q "${test_file}"
          done