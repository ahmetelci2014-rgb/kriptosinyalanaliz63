name: Bot Core Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

concurrency:
  group: bot-core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repo indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --prefer-binary -r requirements.txt

      - name: Gerekli dosyaları kontrol et
        run: |
          pwd
          ls -la
          test -f main.py
          test -f strategy.py
          test -f config.py
          test -f portfolio_risk.py
          test -f scalp_radar.py
          test -f pump_radar.py
          test -f swing_radar.py
          test -f new_listing_radar.py
          test -f coin_analyzer.py
          test -f momentum_shadow.py
          test -f test_main_core.py
          test -f test_momentum_shadow.py

      - name: Aktif Python dosyalarını derle
        run: |
          python -m py_compile \
            main.py \
            strategy.py \
            config.py \
            portfolio_risk.py \
            scalp_radar.py \
            pump_radar.py \
            swing_radar.py \
            new_listing_radar.py \
            coin_analyzer.py \
            momentum_shadow.py \
            test_main_core.py \
            test_momentum_shadow.py

      - name: Ana bot çekirdek testlerini çalıştır
        env:
          TOKEN: ""
          CHAT_ID: ""
        run: |
          python test_main_core.py -v

      - name: Momentum gölge testlerini çalıştır
        run: |
          python momentum_shadow.py --self-test
          python test_momentum_shadow.py -v

      - name: Yeni Liste Radar self-testini çalıştır
        env:
          TOKEN: ""
          CHAT_ID: ""
        run: |
          python new_listing_radar.py --self-test
