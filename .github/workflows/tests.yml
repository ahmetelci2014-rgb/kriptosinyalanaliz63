name: Profit Mode V2 Core Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

concurrency:
  group: profit-mode-v2-core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repo indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Bagimliliklari kur
        run: |
          python -m pip install --prefer-binary -r requirements.txt
          python -m pip install "pytest>=8,<10"

      - name: Profit Mode V2 cekirdek dosyalarini kontrol et
        run: |
          test -f main.py
          test -f strategy.py
          test -f config.py
          test -f premium_profit_runner.py
          test -f scalp_profit_runner.py
          test -f pump_profit_runner.py
          test -f profitability_engine.py
          test -f test_profitability_engine.py
          test -f big_move_shadow_runner.py
          test -f market_impulse_guard.py
          test -f opportunity_capture.py
          test -f live_entry_safety.py
          test -f portfolio_risk.py
          test -f coin_analyzer.py
          test -f test_coin_analyzer.py

      - name: Profit Mode V2 cekirdegini derle
        run: |
          python -m py_compile \
            main.py \
            strategy.py \
            config.py \
            premium_profit_runner.py \
            scalp_radar.py \
            scalp_profit_runner.py \
            pump_radar.py \
            pump_profit_runner.py \
            profitability_engine.py \
            test_profitability_engine.py \
            big_move_route.py \
            big_move_route_runner.py \
            big_move_shadow_runner.py \
            market_impulse_guard.py \
            opportunity_capture.py \
            live_entry_safety.py \
            portfolio_risk.py \
            coin_analyzer.py \
            test_coin_analyzer.py

      - name: Mevcut regresyon testlerini calistir
        env:
          TOKEN: ""
          CHAT_ID: ""
        run: |
          for test_file in test_*.py
          do
            echo "Calistiriliyor: ${test_file}"
            python -m pytest -q "${test_file}"
          done
