name: Extreme Start Historical Research

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Virgul ile semboller (bos = varsayilan + CHIPUSDT)"
        required: false
        type: string
      days:
        description: "Tarihsel gun sayisi"
        required: false
        default: "120"
        type: string

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Paketleri kur
        run: python -m pip install --prefer-binary -r requirements.txt

      - name: Extreme Start testleri
        run: python -m pytest -q test_extreme_start_research.py

      - name: Tarihsel dip tepe erken giris arastirmasi
        env:
          EXTREME_START_SYMBOLS: ${{ inputs.symbols }}
          EXTREME_START_HISTORY_DAYS: ${{ inputs.days }}
        run: python extreme_start_research_runner.py

      - name: Sonucu kaydet
        if: ${{ always() && github.ref_name == 'main' }}
        run: |
          set -e
          if [ ! -f extreme_start_research.json ]; then
            echo "Research state oluşmadı."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add extreme_start_research.json
          if git diff --cached --quiet; then
            echo "Kaydedilecek araştırma değişikliği yok."
            exit 0
          fi
          git commit -m "Update Extreme Start historical research"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
