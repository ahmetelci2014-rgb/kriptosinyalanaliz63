name: Legacy Big Move Replay Research - Manual Only

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: big-move-historical-replay-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: En guncel main ile esitle
        if: ${{ github.ref_name == 'main' }}
        run: |
          set -e
          git fetch origin main
          git reset --hard origin/main
          echo "Research SHA: $(git rev-parse HEAD)"

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Bagimliliklari kur
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --prefer-binary -r requirements.txt

      - name: Gecmis buyuk hareketleri no-lookahead replay et
        env:
          BIG_MOVE_REPLAY_LOOKBACK_DAYS: "90"
          BIG_MOVE_REPLAY_BATCH_SYMBOLS: "8"
          BIG_MOVE_REPLAY_MIN_MOVE: "10"
        run: python big_move_replay_research.py

      - name: Arastirma state dosyasini kaydet
        if: ${{ always() && github.ref_name == 'main' }}
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -f big_move_replay_research.json ]; then
            git add big_move_replay_research.json
          fi

          if git diff --cached --quiet; then
            echo "Kaydedilecek arastirma degisikligi yok."
            exit 0
          fi

          git commit -m "Update Big Move historical replay research state"

          for attempt in 1 2 3
          do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done

          exit 1
