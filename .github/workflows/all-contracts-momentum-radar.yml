name: Legacy All Contracts Momentum Radar - Manual Only

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legacy-all-contracts-momentum-radar
  cancel-in-progress: false

jobs:
  momentum-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Paketleri kur
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --prefer-binary -r requirements.txt

      - name: Eski ani ivme radarini manuel calistir
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MOMENTUM_BINANCE: "1"
          MOMENTUM_OKX: "1"
          MOMENTUM_POLL_SECONDS: "20"
          MOMENTUM_WATCH_SECONDS: "250"
          MOMENTUM_DEEP_SCAN_LIMIT: "24"
          MOMENTUM_SAMPLE_TRIGGER_PCT: "0.35"
          MOMENTUM_24H_TRIGGER_PCT: "4.0"
          MOMENTUM_MIN_1M_PCT: "0.65"
          MOMENTUM_MIN_3M_PCT: "0.90"
          MOMENTUM_MIN_5M_PCT: "1.20"
          MOMENTUM_MIN_RANGE_PCT: "0.85"
          MOMENTUM_MIN_VOLUME_RATIO: "2.0"
          MOMENTUM_MIN_ALERT_SCORE: "5"
          MOMENTUM_COOLDOWN_SECONDS: "900"
        run: python all_contracts_momentum_radar.py
