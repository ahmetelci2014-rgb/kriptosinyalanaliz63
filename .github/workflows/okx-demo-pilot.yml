name: OKX Demo Pilot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = sadece emir planı, execute = OKX demo emri"
        required: true
        type: choice
        default: plan
        options:
          - plan
          - execute
      trade_id:
        description: "Boşsa en yeni uygun Premium sinyal seçilir"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: okx-demo-pilot
  cancel-in-progress: false

jobs:
  demo-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repo indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Paketleri kur
        run: python -m pip install --prefer-binary -r requirements.txt

      - name: Demo executor testleri
        run: python test_okx_demo_executor.py -v

      - name: OKX demo pilotunu çalıştır
        env:
          OKX_DEMO_API_KEY: ${{ secrets.OKX_DEMO_API_KEY }}
          OKX_DEMO_SECRET_KEY: ${{ secrets.OKX_DEMO_SECRET_KEY }}
          OKX_DEMO_PASSPHRASE: ${{ secrets.OKX_DEMO_PASSPHRASE }}
          OKX_DEMO_ENABLED: ${{ vars.OKX_DEMO_ENABLED }}
          OKX_DEMO_MARGIN_USDT: "5"
          OKX_DEMO_LEVERAGE: "2"
          OKX_DEMO_MIN_SCORE: "91"
          OKX_DEMO_MAX_SIGNAL_AGE_MINUTES: "30"
          OKX_DEMO_MAX_ENTRY_DRIFT_PERCENT: "0.25"
          MODE: ${{ inputs.mode }}
          TRADE_ID: ${{ inputs.trade_id }}
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${TRADE_ID}" ]; then
            extra+=(--trade-id "${TRADE_ID}")
          fi
          python okx_demo_executor.py --mode "${MODE}" "${extra[@]}"

      - name: Pilot özeti
        if: always()
        run: |
          echo "### OKX Demo Pilot" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gerçek hesap emri: **YOK**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ortam: **OKX simulated trading**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Margin: **5 USDT demo**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kaldıraç: **2x isolated**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Aynı anda maksimum: **1 demo pozisyon**" >> "$GITHUB_STEP_SUMMARY"
