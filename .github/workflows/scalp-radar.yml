name: Scalp Shadow Data Mode

on:
  workflow_dispatch:
  schedule:
    - cron: "4-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: scalp-shadow-data-mode
  cancel-in-progress: false

jobs:
  scalp:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Paketleri kur
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --prefer-binary -r requirements.txt

      - name: Scalp shadow veri modunu calistir
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python -m py_compile \
            scalp_radar.py \
            scalp_profit_runner.py \
            profitability_engine.py \
            market_impulse_guard.py \
            opportunity_capture.py \
            live_entry_safety.py \
            test_profitability_engine.py \
            test_market_impulse_guard.py
          python -m unittest -v test_profitability_engine.py test_market_impulse_guard.py
          python scalp_profit_runner.py

      - name: Scalp shadow durum ve performans kaydet
        if: always()
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for file in \
            scalp_radar_state.json \
            scalp_performance_ledger.json \
            portfolio_risk_shadow_scalp.json
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "Kaydedilecek Scalp shadow degisikligi yok."
            exit 0
          fi

          git commit -m "Update Scalp shadow data state"

          for attempt in 1 2 3
          do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done

          exit 1
