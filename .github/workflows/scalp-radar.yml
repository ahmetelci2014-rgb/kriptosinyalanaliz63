name: Hızlı Scalp Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "4-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: hizli-scalp-radar
  cancel-in-progress: false

jobs:
  scalp-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur ve pip önbelleğini hazırla
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Paketleri kur
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --prefer-binary -r requirements.txt

      - name: Hızlı scalp radar çalıştır
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scalp_radar.py

      - name: Scalp durum ve performans dosyalarını güvenli kaydet
        if: always()
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for file in \
            scalp_radar_state.json \
            scalp_performance_ledger.json \
            portfolio_risk_shadow.json
          do
            if [ -f "$file" ]; then
              git add "$file"
            else
              echo "$file henüz oluşmamış; atlandı."
            fi
          done

          if git diff --cached --quiet; then
            echo "Scalp dosyalarında kaydedilecek değişiklik yok."
            exit 0
          fi

          git commit -m "Update scalp state performance and portfolio risk shadow"

          for attempt in 1 2 3
          do
            echo "Push denemesi: $attempt"

            git pull --rebase --autostash origin main
            if git push origin HEAD:main
            then
              echo "Scalp durum ve performans dosyaları kaydedildi."
              exit 0
            fi

            sleep 10
          done

          echo "Scalp dosyaları üç denemede de kaydedilemedi."
          exit 1
