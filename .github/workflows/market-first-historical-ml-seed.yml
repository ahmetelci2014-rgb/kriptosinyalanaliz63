name: Market First Historical ML Seed

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "market_first_historical_ml_seed.py"
      - "market_first_historical_replay_v2.py"
      - "market_first_historical_replay_v3.py"
      - "market_first_historical_store_bridge.py"
      - "market_first_ml_training_pool.py"
      - ".github/workflows/market-first-historical-ml-seed.yml"

permissions:
  contents: write

concurrency:
  group: market-first-historical-ml-seed
  cancel-in-progress: false

jobs:
  historical-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: En guncel main ile esitle
        if: ${{ github.ref_name == 'main' }}
        run: |
          set -e
          git fetch origin main
          git reset --hard origin/main
          echo "Historical seed SHA: $(git rev-parse HEAD)"

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Bagimliliklari kur
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --prefer-binary -r requirements.txt

      - name: Canli ve tarihsel ML state'ini worktree icinde birlestir
        run: python market_first_historical_store_bridge.py prepare

      - name: Market First gecmisinde kacirilan firsatlari no-lookahead ogren
        env:
          MARKET_FIRST_HIST_LOOKBACK_DAYS: "45"
          MARKET_FIRST_HIST_BATCH_SYMBOLS: "12"
          MARKET_FIRST_HIST_MAX_EVALS: "160"
          MARKET_FIRST_HIST_OUTCOME_HOURS: "18"
          MARKET_FIRST_HIST_MIN_QUOTE_VOLUME: "250000"
          MARKET_FIRST_HIST_COST_PERCENT: "0.12"
        run: python market_first_historical_replay_v3.py

      - name: Tarihsel ornekleri ayri havuza cikar ve canli state'i geri yukle
        if: ${{ always() }}
        run: python market_first_historical_store_bridge.py finalize

      - name: Tarihsel egitim havuzunu kaydet
        if: ${{ success() && github.ref_name == 'main' }}
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for file in \
            market_first_historical_ml_samples.json \
            market_first_historical_seed_state.json \
            market_first_historical_seed_report.json
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "Yeni tarihsel ML ornegi yok."
            exit 0
          fi

          git commit -m "Update Market First historical ML training pool"

          for attempt in 1 2 3 4
          do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 12
          done

          exit 1
