name: Sistem Kontrol Merkezi

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: system-control-center
  cancel-in-progress: false

jobs:
  system-control-center:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: İzleme workflow bağlantılarını doğrula
        run: |
          set -e
          for file in \
            .github/workflows/main.yml \
            .github/workflows/scalp-radar.yml \
            .github/workflows/pump-radar.yml \
            .github/workflows/big-move-route.yml \
            .github/workflows/swing-shadow-v4.yml \
            .github/workflows/position-trend-shadow.yml \
            .github/workflows/all-market-shadow.yml \
            .github/workflows/momentum-shadow.yml \
            .github/workflows/range-shadow.yml \
            .github/workflows/portfolio-risk-outcomes.yml \
            .github/workflows/new-listing-radar.yml \
            .github/workflows/decision-engine.yml
          do
            test -f "$file"
          done

      - name: Kontrol merkezi testleri
        run: |
          python -m unittest -v test_system_control_center.py

      - name: Merkezi raporu üret
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import system_control_center as center

          for key in ("PREMIUM", "SCALP", "PUMP_DUMP", "POST_RESULT"):
              center.COMPONENTS[key]["stale_hours"] = 1.5

          center.COMPONENTS["BIG_MOVE_ROUTE"] = {
              "label": "Büyük Hareket Fiyat Rotası",
              "kind": "LIVE_SIGNAL",
              "files": ["big_move_route_state.json", "big_move_route_ledger.json"],
              "workflow": ".github/workflows/big-move-route.yml",
              "stale_hours": 3.0,
              "open_paths": [("big_move_route_state.json", "open_routes")],
          }

          center.COMPONENTS["SWING_V4_SHADOW"]["label"] = "Swing Shadow V5"
          center.COMPONENTS["POSITION_TREND"]["label"] = "Ana Trend Pozisyon Shadow V2"
          center.COMPONENTS["MOMENTUM_SHADOW"]["label"] = "Momentum Shadow V2"

          center.COMPONENTS["SWING_V4_SHADOW"]["stale_hours"] = 8.0
          center.COMPONENTS["POSITION_TREND"]["stale_hours"] = 14.0
          center.COMPONENTS["MOMENTUM_SHADOW"]["stale_hours"] = 14.0
          center.COMPONENTS["PORTFOLIO_RISK"]["stale_hours"] = 12.0

          if os.path.exists("range_shadow_v4.json"):
              center.COMPONENTS["RANGE_SHADOW"]["label"] = "Range Cycle Shadow V4"
              center.COMPONENTS["RANGE_SHADOW"]["files"] = ["range_shadow_v4.json"]
              center.COMPONENTS["RANGE_SHADOW"]["stale_hours"] = 10.0
          else:
              center.COMPONENTS["RANGE_SHADOW"]["label"] = "Range Cycle Shadow V3 Arşiv"
              center.COMPONENTS["RANGE_SHADOW"]["stale_hours"] = 24.0 * 365.0

          center.COMPONENTS["NEW_LISTING"]["stale_hours"] = 2.0
          center.COMPONENTS["MOMENTUM_SHADOW"]["workflow"] = ".github/workflows/momentum-shadow.yml"
          center.COMPONENTS["RANGE_SHADOW"]["workflow"] = ".github/workflows/range-shadow.yml"
          center.COMPONENTS["PORTFOLIO_RISK"]["workflow"] = ".github/workflows/portfolio-risk-outcomes.yml"
          center.COMPONENTS["PRESCRIPTION_ENGINE"]["workflow"] = ".github/workflows/decision-engine.yml"

          center.run()
          PY

      - name: Yalnız kontrol merkezi raporlarını kaydet
        if: always()
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for file in system_control_center_report.json system_control_center_report.md system_control_alert_state.json
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "Kontrol merkezi raporunda değişiklik yok."
            exit 0
          fi

          git commit -m "Update system control center report"

          for attempt in 1 2 3
          do
            echo "Push denemesi: $attempt"
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              echo "Kontrol merkezi raporu kaydedildi."
              exit 0
            fi
            sleep 10
          done

          echo "Kontrol merkezi raporu kaydedilemedi."
          exit 1