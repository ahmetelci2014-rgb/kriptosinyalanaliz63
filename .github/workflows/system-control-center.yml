name: Sistem Kontrol Merkezi

on:
  workflow_dispatch:
  schedule:
    - cron: "13 * * * *"

permissions:
  contents: write

concurrency:
  group: system-control-center
  cancel-in-progress: false

jobs:
  system-control-center:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kontrol merkezi testleri
        run: |
          python -m unittest -v test_system_control_center.py

      - name: Merkezi raporu üret
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python system_control_center.py

      - name: Yalnız kontrol merkezi raporlarını kaydet
        if: always()
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for file in system_control_center_report.json system_control_center_report.md system_control_alert_state.json
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "Kontrol merkezi raporunda değişiklik yok."
            exit 0
          fi

          git commit -m "Update system control center report"

          for attempt in 1 2 3
          do
            echo "Push denemesi: $attempt"
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              echo "Kontrol merkezi raporu kaydedildi."
              exit 0
            fi
            sleep 10
          done

          echo "Kontrol merkezi raporu kaydedilemedi."
          exit 1
