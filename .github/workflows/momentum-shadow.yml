name: Momentum Shadow v1

on:
  workflow_dispatch:
  schedule:
    - cron: "3-58/5 * * * *"

permissions:
  contents: write

concurrency:
  group: momentum-shadow-v1
  cancel-in-progress: false

jobs:
  momentum-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Bağımlılıkları kur
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --prefer-binary -r requirements.txt

      - name: Momentum motorunu doğrula
        run: |
          python -m py_compile momentum_shadow.py test_momentum_shadow.py
          python momentum_shadow.py --self-test
          python test_momentum_shadow.py -v

      - name: Momentum gölge analizini çalıştır
        run: python momentum_shadow.py

      - name: Momentum gölge ledgerını kaydet
        if: always()
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -f "momentum_shadow.json" ]; then
            git add momentum_shadow.json
          else
            echo "momentum_shadow.json oluşmadı."
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Momentum gölge ledgerında yeni değişiklik yok."
            exit 0
          fi

          git commit -m "Update momentum shadow ledger"

          for attempt in 1 2 3
          do
            echo "Push denemesi: $attempt"
            git pull --rebase --autostash origin main

            if git push origin HEAD:main; then
              echo "Momentum gölge ledgerı kaydedildi."
              exit 0
            fi

            sleep 10
          done

          echo "Momentum gölge ledgerı üç denemede de kaydedilemedi."
          exit 1
