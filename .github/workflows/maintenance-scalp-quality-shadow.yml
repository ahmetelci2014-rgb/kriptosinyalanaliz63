name: One-time Scalp Quality Shadow Maintenance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/maintenance-scalp-quality-shadow.yml"

permissions:
  contents: write

concurrency:
  group: one-time-scalp-quality-shadow-maintenance
  cancel-in-progress: false

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ATAK tek kaynak ve karşılaştırma gölgesini uygula
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: beklenen 1 eşleşme, bulunan {count}")
              return text.replace(old, new, 1)

          path = Path("scalp_radar.py")
          text = path.read_text(encoding="utf-8")

          text = replace_once(
              text,
              'PERFORMANCE_FILE = "scalp_performance_ledger.json"\n',
              'PERFORMANCE_FILE = "scalp_performance_ledger.json"\n'
              'ATTACK_GUARD_SHADOW_FILE = "scalp_attack_guard_shadow.json"\n',
              "shadow file sabiti",
          )

          text = replace_once(
              text,
              'ATTACK_LONG_MIN_CLOSE_POWER = 62\n',
              '# Eski 62 eşiği yalnız karşılaştırma gölgesi içindir.\n'
              'ATTACK_LEGACY_LONG_MIN_CLOSE_POWER = 62\n'
              '# Canlı ATAK kalite korumasının tek kaynak değeri.\n'
              'ATTACK_LONG_MIN_CLOSE_POWER = 70\n',
              "atak long tek kaynak",
          )
          text = replace_once(
              text,
              'ATTACK_SHORT_MAX_CLOSE_POWER = 38\n',
              '# Eski 38 eşiği yalnız karşılaştırma gölgesi içindir.\n'
              'ATTACK_LEGACY_SHORT_MAX_CLOSE_POWER = 38\n'
              '# Canlı ATAK kalite korumasının tek kaynak değeri.\n'
              'ATTACK_SHORT_MAX_CLOSE_POWER = 30\n\n'
              'ATTACK_GUARD_SHADOW_KEEP_DAYS = 14\n'
              'ATTACK_GUARD_SHADOW_MAX_RECORDS = 300\n'
              'ATTACK_GUARD_SHADOW_MAX_TRACK_MINUTES = 180\n',
              "atak short tek kaynak",
          )

          shadow_block = r'''

# =========================================================
# ATAK 70/30 KARŞILAŞTIRMA GÖLGESİ
# =========================================================
# Eski 62/38 kapanış gücü filtresine göre canlı aday olacakken yeni 70/30
# koruması yüzünden elenen adayları sessizce izler. Telegram göndermez, gerçek
# açık işlem sayısını/portföy limitini etkilemez ve otomatik kural uygulamaz.

def empty_attack_guard_shadow():
    return {
        "version": "SCALP_ATTACK_GUARD_SHADOW_V1_2026_08_18",
        "mode": "SHADOW_ONLY_NO_TELEGRAM_NO_LIVE_SIGNAL_CHANGE",
        "auto_apply": False,
        "legacy_thresholds": {
            "long_min_close_power": ATTACK_LEGACY_LONG_MIN_CLOSE_POWER,
            "short_max_close_power": ATTACK_LEGACY_SHORT_MAX_CLOSE_POWER,
        },
        "live_thresholds": {
            "long_min_close_power": ATTACK_LONG_MIN_CLOSE_POWER,
            "short_max_close_power": ATTACK_SHORT_MAX_CLOSE_POWER,
        },
        "records": [],
        "summary": {},
    }


def load_attack_guard_shadow():
    try:
        if not os.path.exists(ATTACK_GUARD_SHADOW_FILE):
            return empty_attack_guard_shadow()
        with open(ATTACK_GUARD_SHADOW_FILE, "r", encoding="utf-8") as handle:
            data = json.load(handle)
        if not isinstance(data, dict):
            return empty_attack_guard_shadow()
        data.setdefault("records", [])
        data.setdefault("summary", {})
        data["version"] = "SCALP_ATTACK_GUARD_SHADOW_V1_2026_08_18"
        data["mode"] = "SHADOW_ONLY_NO_TELEGRAM_NO_LIVE_SIGNAL_CHANGE"
        data["auto_apply"] = False
        data["legacy_thresholds"] = {
            "long_min_close_power": ATTACK_LEGACY_LONG_MIN_CLOSE_POWER,
            "short_max_close_power": ATTACK_LEGACY_SHORT_MAX_CLOSE_POWER,
        }
        data["live_thresholds"] = {
            "long_min_close_power": ATTACK_LONG_MIN_CLOSE_POWER,
            "short_max_close_power": ATTACK_SHORT_MAX_CLOSE_POWER,
        }
        return data
    except Exception as exc:
        print("ATAK guard shadow okuma hatası:", exc)
        return empty_attack_guard_shadow()


def rebuild_attack_guard_shadow_summary(data):
    records = [item for item in data.get("records", []) if isinstance(item, dict)]
    resolved = [item for item in records if str(item.get("outcome", "OPEN")).upper() != "OPEN"]
    tp1_count = sum(1 for item in resolved if item.get("tp1_hit"))
    tp3_count = sum(1 for item in resolved if item.get("tp3_hit"))
    stop_count = sum(1 for item in resolved if item.get("outcome") == "STOP_BEFORE_TP1")
    tp1_only_count = sum(1 for item in resolved if item.get("outcome") == "TP1_ONLY")
    expired_count = sum(1 for item in resolved if item.get("outcome") == "EXPIRED_NO_TP1")
    sample = len(resolved)

    def rate(value):
        return round((value / sample) * 100.0, 2) if sample else 0.0

    if sample < 30:
        decision = "VERI_TOPLA"
        next_action = "En az 30 sonuçlanmış legacy-only ATAK adayı biriktir; canlı filtreyi otomatik değiştirme."
    elif rate(tp1_count) >= 60.0:
        decision = "70_30_COK_SIKI_OLABILIR_GOLGE_INCELE"
        next_action = "Yeni guardın kaçırdığı TP1/TP3 adayları yüksek; yalnız gölgede daha gevşek ara eşik test et."
    elif rate(stop_count) >= 50.0 and rate(tp1_count) <= 40.0:
        decision = "70_30_GUARD_DESTEKLENIYOR"
        next_action = "Legacy-only adayların çoğu TP1 öncesi stop; 70/30 korumasını canlıda koru ve örneği büyüt."
    else:
        decision = "KARSILASTIR"
        next_action = "TP1/TP3 ve TP1-öncesi stop dağılımını büyüt; canlı eşik değişikliği yapma."

    by_direction = {}
    for direction in ("LONG", "SHORT"):
        subset = [item for item in resolved if str(item.get("direction", "")).upper() == direction]
        by_direction[direction] = {
            "sample": len(subset),
            "tp1_before_stop": sum(1 for item in subset if item.get("tp1_hit")),
            "tp3": sum(1 for item in subset if item.get("tp3_hit")),
            "stop_before_tp1": sum(1 for item in subset if item.get("outcome") == "STOP_BEFORE_TP1"),
        }

    data["summary"] = {
        "total_candidates": len(records),
        "open": len(records) - sample,
        "resolved": sample,
        "tp1_before_stop": tp1_count,
        "tp1_before_stop_rate_percent": rate(tp1_count),
        "tp3": tp3_count,
        "tp3_rate_percent": rate(tp3_count),
        "stop_before_tp1": stop_count,
        "stop_before_tp1_rate_percent": rate(stop_count),
        "tp1_only": tp1_only_count,
        "expired_no_tp1": expired_count,
        "by_direction": by_direction,
        "decision": decision,
        "next_action": next_action,
        "minimum_decision_sample": 30,
        "auto_apply": False,
        "method": "Eski 62/38'e göre uygun, yeni 70/30 yüzünden elenen ATAK adaylarında 1M mum sırasıyla TP1/TP3 ve TP1-öncesi SL izlenir.",
    }
    data["updated_at"] = now_ts()
    data["updated_at_tr"] = tr_now_text()


def save_attack_guard_shadow(data):
    try:
        rebuild_attack_guard_shadow_summary(data)
        return atomic_save_json(ATTACK_GUARD_SHADOW_FILE, data)
    except Exception as exc:
        print("ATAK guard shadow kayıt hatası:", exc)
        return False


def record_attack_guard_shadow_candidate(item):
    if not isinstance(item, dict) or not item.get("counterfactual_attack_guard"):
        return None

    data = load_attack_guard_shadow()
    records = data.setdefault("records", [])
    symbol = normalize_bot_symbol(item.get("symbol"))
    direction = str(item.get("direction", "")).upper()
    entry = safe_float(item.get("entry"))
    sl = safe_float(item.get("sl"))
    created_at = now_ts()

    if not symbol or direction not in ("LONG", "SHORT") or entry <= 0 or sl <= 0:
        return None

    for existing in records:
        if (
            normalize_bot_symbol(existing.get("symbol")) == symbol
            and str(existing.get("direction", "")).upper() == direction
            and created_at - int(existing.get("created_at", 0)) < DUPLICATE_SECONDS
        ):
            return None

    risk = entry - sl if direction == "LONG" else sl - entry
    if risk <= 0:
        return None

    if direction == "LONG":
        tp1 = entry + risk * TP1_R
        tp2 = entry + risk * TP2_R
        tp3 = entry + risk * TP3_R
    else:
        tp1 = entry - risk * TP1_R
        tp2 = entry - risk * TP2_R
        tp3 = entry - risk * TP3_R
        if min(tp1, tp2, tp3) <= 0:
            return None

    record_id = f"{symbol}_{direction}_ATTACK_GUARD_{created_at}"
    record = {
        "id": record_id,
        "symbol": symbol,
        "direction": direction,
        "source": "ATAK_SCALP",
        "stage": "ATTACK_GUARD_SHADOW",
        "created_at": created_at,
        "created_at_tr": tr_now_text(),
        "last_checked_at": created_at - 1,
        "entry": entry,
        "sl": sl,
        "tp1": tp1,
        "tp2": tp2,
        "tp3": tp3,
        "risk_percent": safe_float(item.get("risk_percent")),
        "close_power": safe_float(item.get("close_power")),
        "legacy_score": int(item.get("legacy_score", 0)),
        "live_score": int(item.get("live_score", 0)),
        "legacy_close_power_threshold": item.get("legacy_close_power_threshold"),
        "live_close_power_threshold": item.get("live_close_power_threshold"),
        "rsi1": safe_float(item.get("rsi1")),
        "rsi5": safe_float(item.get("rsi5")),
        "vol1": safe_float(item.get("vol1")),
        "vol5": safe_float(item.get("vol5")),
        "move1": safe_float(item.get("move1")),
        "move5": safe_float(item.get("move5")),
        "move15": safe_float(item.get("move15")),
        "breakout": bool(item.get("breakout", False)),
        "tp1_hit": False,
        "tp2_hit": False,
        "tp3_hit": False,
        "outcome": "OPEN",
        "resolution_note": "Legacy 62/38 uygun; canlı 70/30 kapanış gücü guardı nedeniyle elendi.",
    }
    records.append(record)

    cutoff = created_at - ATTACK_GUARD_SHADOW_KEEP_DAYS * 24 * 60 * 60
    records = [row for row in records if int(row.get("created_at", 0)) >= cutoff]
    records.sort(key=lambda row: int(row.get("created_at", 0)))
    data["records"] = records[-ATTACK_GUARD_SHADOW_MAX_RECORDS:]
    save_attack_guard_shadow(data)
    return record_id


def update_attack_guard_shadow(exchange):
    data = load_attack_guard_shadow()
    records = data.setdefault("records", [])
    open_records = [row for row in records if str(row.get("outcome", "OPEN")).upper() == "OPEN"]

    if not open_records:
        save_attack_guard_shadow(data)
        print("ATAK guard shadow: açık sanal aday yok.")
        return

    resolved_now = 0
    for record in open_records:
        try:
            symbol = normalize_bot_symbol(record.get("symbol"))
            direction = str(record.get("direction", "")).upper()
            entry = safe_float(record.get("entry"))
            sl = safe_float(record.get("sl"))
            tp1 = safe_float(record.get("tp1"))
            tp2 = safe_float(record.get("tp2"))
            tp3 = safe_float(record.get("tp3"))
            created_at = int(record.get("created_at", now_ts()))
            last_checked_at = int(record.get("last_checked_at", created_at - 1))

            candles = fetch_candles_since(
                exchange,
                symbol,
                TRACK_TIMEFRAME,
                max(created_at, last_checked_at - 120),
                TRACK_LIMIT,
            )

            for candle in candles:
                candle_time = int(candle.get("time") or 0)
                if candle_time <= last_checked_at:
                    continue

                high = safe_float(candle.get("high"))
                low = safe_float(candle.get("low"))
                close = safe_float(candle.get("close"))
                just_hit_tp1 = False

                if not record.get("tp1_hit"):
                    if direction == "LONG":
                        hit_sl = low <= sl
                        hit_tp1 = high >= tp1
                        if hit_sl and hit_tp1:
                            if close >= entry:
                                hit_sl = False
                            else:
                                hit_tp1 = False
                    else:
                        hit_sl = high >= sl
                        hit_tp1 = low <= tp1
                        if hit_sl and hit_tp1:
                            if close <= entry:
                                hit_sl = False
                            else:
                                hit_tp1 = False

                    if hit_sl:
                        record["outcome"] = "STOP_BEFORE_TP1"
                        record["resolved_at"] = candle_time
                        record["resolved_at_tr"] = tr_now_text()
                        resolved_now += 1
                        last_checked_at = candle_time
                        break

                    if hit_tp1:
                        record["tp1_hit"] = True
                        record["tp1_hit_at"] = candle_time
                        just_hit_tp1 = True

                if record.get("tp1_hit"):
                    hit_tp2 = (high >= tp2) if direction == "LONG" else (low <= tp2)
                    hit_tp3 = (high >= tp3) if direction == "LONG" else (low <= tp3)
                    if hit_tp2 and not record.get("tp2_hit"):
                        record["tp2_hit"] = True
                        record["tp2_hit_at"] = candle_time
                    if hit_tp3:
                        record["tp3_hit"] = True
                        record["tp3_hit_at"] = candle_time
                        record["outcome"] = "TP3"
                        record["resolved_at"] = candle_time
                        record["resolved_at_tr"] = tr_now_text()
                        resolved_now += 1
                        last_checked_at = candle_time
                        break

                last_checked_at = max(last_checked_at, candle_time)

            record["last_checked_at"] = last_checked_at

            if str(record.get("outcome", "OPEN")).upper() == "OPEN":
                age_minutes = max(0.0, (now_ts() - created_at) / 60.0)
                if age_minutes >= ATTACK_GUARD_SHADOW_MAX_TRACK_MINUTES:
                    record["outcome"] = "TP1_ONLY" if record.get("tp1_hit") else "EXPIRED_NO_TP1"
                    record["resolved_at"] = now_ts()
                    record["resolved_at_tr"] = tr_now_text()
                    resolved_now += 1

        except Exception as exc:
            print(record.get("id"), "ATAK guard shadow takip hatası:", exc)

    save_attack_guard_shadow(data)
    print("ATAK guard shadow güncellendi | açık:", len(open_records), "| yeni sonuç:", resolved_now)
'''

