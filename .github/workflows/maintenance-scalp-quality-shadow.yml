          start = workflow.index("      - name: Hızlı scalp radar çalıştır\n")
          end = workflow.index("\n      - name: Scalp durum ve performans dosyalarını güvenli kaydet", start)
          direct_step = '''      - name: Hızlı scalp radar çalıştır\n        env:\n          TOKEN: ${{ secrets.TOKEN }}\n          CHAT_ID: ${{ secrets.CHAT_ID }}\n          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n          GITHUB_REPOSITORY: ${{ github.repository }}\n          GITHUB_REF_NAME: ${{ github.ref_name }}\n        run: python scalp_radar.py\n'''
          workflow = workflow[:start] + direct_step + workflow[end:]
          workflow = replace_once(
              workflow,
              '            scalp_performance_ledger.json \\\n            portfolio_risk_shadow_scalp.json\n',
              '            scalp_performance_ledger.json \\\n            scalp_attack_guard_shadow.json \\\n            portfolio_risk_shadow_scalp.json\n',
              "shadow json workflow kaydı",
          )
          workflow_path.write_text(workflow, encoding="utf-8")
          PY

      - name: Sentetik karşılaştırma gölge testi
        run: |
          python -m py_compile scalp_radar.py
          python - <<'PY'
          import os
          import tempfile
          import scalp_radar as radar

          assert radar.ATTACK_LONG_MIN_CLOSE_POWER == 70
          assert radar.ATTACK_SHORT_MAX_CLOSE_POWER == 30
          assert radar.ATTACK_LEGACY_LONG_MIN_CLOSE_POWER == 62
          assert radar.ATTACK_LEGACY_SHORT_MAX_CLOSE_POWER == 38

          with tempfile.TemporaryDirectory() as tmp:
              radar.ATTACK_GUARD_SHADOW_FILE = os.path.join(tmp, "shadow.json")
              candidate = {
                  "counterfactual_attack_guard": True,
                  "symbol": "TESTUSDT",
                  "direction": "LONG",
                  "entry": 100.0,
                  "sl": 99.0,
                  "risk_percent": 1.0,
                  "close_power": 65.0,
                  "legacy_score": 90,
                  "live_score": 80,
                  "legacy_close_power_threshold": 62,
                  "live_close_power_threshold": 70,
                  "rsi1": 60,
                  "rsi5": 58,
                  "vol1": 2.0,
                  "vol5": 1.5,
                  "move1": 0.2,
                  "move5": 0.5,
                  "move15": 0.3,
                  "breakout": True,
              }
              record_id = radar.record_attack_guard_shadow_candidate(candidate)
              assert record_id
              data = radar.load_attack_guard_shadow()
              record = data["records"][0]
              base = int(record["created_at"])

              def fake_candles(*args, **kwargs):
                  return [
                      {"time": base + 60, "open": 100.0, "high": 100.8, "low": 99.8, "close": 100.5, "volume": 1.0},
                      {"time": base + 120, "open": 100.5, "high": 101.8, "low": 100.2, "close": 101.7, "volume": 1.0},
                  ]

              radar.fetch_candles_since = fake_candles
              radar.update_attack_guard_shadow(object())
              data = radar.load_attack_guard_shadow()
              record = data["records"][0]
              assert record["tp1_hit"] is True
              assert record["tp3_hit"] is True
              assert record["outcome"] == "TP3"
              assert data["summary"]["auto_apply"] is False
          print("ATAK guard shadow sentetik test: OK")
          PY

      - name: Tek seferlik bakım workflowunu kaldır ve değişiklikleri kaydet
        shell: bash
        run: |
          set -e
          rm -f .github/workflows/maintenance-scalp-quality-shadow.yml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add scalp_radar.py .github/workflows/scalp-radar.yml .github/workflows/maintenance-scalp-quality-shadow.yml
          git commit -m "Add scalp attack guard counterfactual shadow"

          for attempt in 1 2 3
          do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              echo "Scalp kalite bakım paketi kaydedildi."
              exit 0
            fi
            sleep 10
          done
          echo "Scalp kalite bakım paketi push edilemedi."
