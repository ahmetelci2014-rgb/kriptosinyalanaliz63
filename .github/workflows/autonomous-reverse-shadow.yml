name: Autonomous Trade and Reverse Shadow V1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autonomous-reverse-shadow-v1
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: En guncel main state ile esitle
        if: ${{ github.ref_name == 'main' }}
        run: |
          set -e
          git fetch origin main
          git reset --hard origin/main

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Bagimliliklari kur
        run: python -m pip install --prefer-binary -r requirements.txt

      - name: Autonomous Reverse Shadow V1 calistir
        env:
          AR_MAX_UNIVERSE_COINS: "120"
          AR_DEEP_SCAN_PER_RUN: "20"
          AR_MAX_OPEN_POSITIONS: "6"
          AR_MAX_NEW_POSITIONS_PER_RUN: "2"
          AR_MIN_ENTRY_SCORE: "80"
          AR_MIN_REVERSE_PROFIT_R: "0.55"
          AR_REVERSE_SCORE_THRESHOLD: "90"
          AR_MAX_REVERSES_PER_CHAIN: "1"
          AR_DAILY_RISK_STOP_R: "-3.0"
        run: python autonomous_reverse_shadow.py

      - name: Shadow state ve ledger kaydet
        if: ${{ always() && github.ref_name == 'main' }}
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for f in autonomous_reverse_shadow_state.json autonomous_reverse_shadow_ledger.json
          do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "Kaydedilecek Autonomous Reverse state yok."
            exit 0
          fi

          git commit -m "Update Autonomous Reverse Shadow state"

          for attempt in 1 2 3
          do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 8
          done
          exit 1
