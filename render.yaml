services:
  - type: web
    name: kripto-kontrol-paneli
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.dashboard
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: GITHUB_REPOSITORY
        value: ahmetelci2014-rgb/kriptosinyalanaliz63
      - key: GITHUB_REF_NAME
        value: main
      - key: GITHUB_PANEL_TOKEN
        sync: false
      - key: GITHUB_PANEL_USERS_TOKEN
        sync: false
      - key: PANEL_USERS_REF
        value: panel-users
      - key: PANEL_USERS_PATH
        value: panel_users.json
      - key: PANEL_USERNAME
        value: ahmet
      - key: PANEL_PASSWORD_HASH
        sync: false
      - key: PANEL_REFRESH_SECONDS
        value: "30"
      - key: PANEL_SESSION_HOURS
        value: "12"
      - key: PANEL_COOKIE_SECURE
        value: "1"
      - key: PANEL_TRUST_PROXY
        value: "1"
